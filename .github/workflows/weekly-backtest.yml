name: Weekly walk-forward backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 6"

permissions:
  contents: write

concurrency:
  group: foreign-flow-data-write
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Run campaign walk-forward backtest
        run: python -m kis_flow_bot backtest
      - name: Persist calibration and report
        shell: bash
        run: |
          git config user.name "foreign-flow-bot"
          git config user.email "foreign-flow-bot@users.noreply.github.com"
          git add data/calibration.json reports/backtest_latest.csv reports/backtest_latest.md
          if git diff --cached --quiet; then
            echo "변경된 백테스트 결과가 없습니다."
            exit 0
          fi
          git commit -m "bot: update walk-forward calibration"
          git push
