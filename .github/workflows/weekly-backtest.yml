name: Weekly walk-forward backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/kis_flow_bot/**"
      - "tests/**"
      - "pyproject.toml"
      - "config.toml"
      - ".github/workflows/weekly-backtest.yml"
  schedule:
    - cron: "17 0 * * 6"

permissions:
  contents: write

concurrency:
  group: foreign-flow-data-write
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Run campaign walk-forward backtest
        run: python -m kis_flow_bot backtest
      - name: Run daily-brief screen backtest
        run: python -m kis_flow_bot screen-backtest --step 1
      - name: Self-validation (whole-universe IC, walk-forward challenger, Jev replay)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m kis_flow_bot research
      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-backtest-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist calibration and report
        shell: bash
        run: |
          git config user.name "foreign-flow-bot"
          git config user.email "foreign-flow-bot@users.noreply.github.com"
          for f in data/calibration.json reports/backtest_latest.csv reports/backtest_thresholds.csv \
            reports/backtest_score_bands.csv reports/backtest_latest.md reports/screen_backtest.csv reports/screen_backtest.md \
            data/learned_ranker.json data/model_registry.json \
            reports/research_latest.md reports/research_factors.csv reports/research_oos.csv \
            data/jev_replay.csv data/jev_verdict.json reports/jev_replay.md \
            data/dart_corp_codes.csv data/dart_filings.csv data/dart_coverage.json \
            data/jev_event_answers.csv data/jev_event_verdict.json reports/jev_events.md \
            data/dart_financials.csv reports/portfolio_backtest.md reports/portfolio_backtest.csv; do
            if [[ -e "$f" ]]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "변경된 백테스트 결과가 없습니다."
            exit 0
          fi
          git commit -m "bot: update walk-forward calibration"
          git push
