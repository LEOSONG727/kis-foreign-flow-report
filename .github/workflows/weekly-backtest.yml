name: Weekly walk-forward backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/kis_flow_bot/**"
      - "tests/**"
      - "pyproject.toml"
      - "config.toml"
      - ".github/workflows/weekly-backtest.yml"
  schedule:
    - cron: "17 0 * * 6"

permissions:
  contents: write

# Serialize all result writers; queue multiple pending runs without replacing them.
concurrency:
  group: foreign-flow-data-write
  queue: max
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Run campaign walk-forward backtest
        run: python -m kis_flow_bot backtest
      - name: Run daily-brief screen backtest
        run: python -m kis_flow_bot screen-backtest --step 1
      - name: Persist results
        shell: bash
        run: |
          bash .github/scripts/persist-results.sh "bot: update walk-forward calibration" \
            data/calibration.json reports/backtest_latest.csv reports/backtest_thresholds.csv \
            reports/backtest_score_bands.csv reports/backtest_latest.md reports/screen_backtest.csv \
            reports/screen_backtest.md

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-backtest-${{ github.run_number }}
          path: |
            data/calibration.json
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 30
