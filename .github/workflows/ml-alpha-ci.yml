name: ML alpha validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,ml]"
      - run: pytest
      - name: Run V3.1-C rich historical replay
        run: python -m kis_flow_bot ml-rich --step 1
      - name: Show rich model report
        if: always()
        run: cat reports/ml_rich_ranking.md || true
      - name: Upload ML artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-rich-validation-${{ github.run_number }}
          path: |
            reports/ml_rich_features.csv
            reports/ml_rich_tuning.csv
            reports/ml_rich_ranking.csv
            reports/ml_rich_ranking.md
          if-no-files-found: warn
          retention-days: 14
