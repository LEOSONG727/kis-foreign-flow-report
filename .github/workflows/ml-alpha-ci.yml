name: ML alpha validation

on:
  pull_request:
    paths:
      - "src/kis_flow_bot/ml_alpha.py"
      - "src/kis_flow_bot/ml_ranking.py"
      - "src/kis_flow_bot/cli.py"
      - "tests/test_ml_alpha.py"
      - "tests/test_ml_ranking.py"
      - "pyproject.toml"
      - ".github/workflows/ml-alpha-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,ml]"
      - run: pytest
      - name: Run V3.1-A offline alpha baseline
        run: python -m kis_flow_bot ml-alpha
      - name: Run V3.1-B pairwise ranking
        run: python -m kis_flow_bot ml-ranking
      - name: Show ML reports
        if: always()
        run: |
          cat reports/ml_alpha_baseline.md || true
          cat reports/ml_pairwise_ranking.md || true
      - name: Upload ML artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-alpha-validation-${{ github.run_number }}
          path: |
            reports/ml_alpha_baseline.csv
            reports/ml_alpha_baseline.md
            reports/ml_pairwise_ranking.csv
            reports/ml_pairwise_ranking.md
          if-no-files-found: warn
          retention-days: 14
