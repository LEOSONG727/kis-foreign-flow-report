name: Recover validated ML shadow data

on:
  push:
    branches:
      - feature/v3-1c-rich-history-model
    paths:
      - ".github/workflows/recover-ml-shadow.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: foreign-flow-data-write
  cancel-in-progress: false

jobs:
  recover-and-run-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the sealed-validation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35511779598 \
            --repo "$GITHUB_REPOSITORY" \
            --name ml-history-bootstrap-1 \
            --dir recovered
          cp recovered/reports/ml_rich_features.csv reports/ml_rich_features.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,ml]"

      - name: Test
        run: pytest

      - name: Fit shadow model and rebuild the current stored-data report
        run: python -m kis_flow_bot rerank --no-notify

      - name: Show ML shadow section
        run: |
          sed -n '/ML Shadow TOP 5/,/다음 후보/p' reports/latest.md | head -30

      - name: Persist training data and shadow outputs
        run: |
          git config user.name "foreign-flow-bot"
          git config user.email "foreign-flow-bot@users.noreply.github.com"
          git add reports data/ml_shadow_snapshots.csv data/state.json data/horizon_core.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: activate validated ML shadow ranking"
          git push origin HEAD:feature/v3-1c-rich-history-model
