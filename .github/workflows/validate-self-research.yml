name: Validate self-research and Jev replay

# PR 브랜치에서 저장소 Secret으로 한 번 검증한다.
# 1) KIS 키 연결 2) KIS 과거 이력 깊이(소수 종목, 커밋하지 않음)
# 3) 자가검증 + Jev 과거 재생(결과만 이 브랜치에 커밋)
on:
  push:
    branches:
      - claude/funny-archimedes-rb1yay
    paths:
      - ".github/workflows/validate-self-research.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foreign-flow-data-write
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      KIS_CALLS_PER_SECOND: ${{ vars.KIS_CALLS_PER_SECOND || '5' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Report which secrets are present (values are never printed)
        run: |
          for name in KIS_APP_KEY KIS_APP_SECRET TYPESAFE_API_KEY; do
            if [[ -n "${!name}" ]]; then echo "$name: set"; else echo "$name: MISSING"; fi
          done
      - name: KIS connection
        run: python -m kis_flow_bot smoke
      - name: KIS history depth probe (3 symbols, not committed)
        run: |
          # KIS issues at most one access token per minute.
          sleep 65
          python -m kis_flow_bot deep-backfill --universe-limit 3 --days 540 --max-minutes 5
          git checkout -- data/history.csv
      - name: Self-validation and Jev replay
        run: python -m kis_flow_bot research --max-calls 1500
      - name: Persist validation results to this branch
        run: |
          git config user.name "foreign-flow-bot"
          git config user.email "foreign-flow-bot@users.noreply.github.com"
          git add data/learned_ranker.json data/model_registry.json \
            reports/research_latest.md reports/research_factors.csv reports/research_oos.csv \
            data/jev_replay.csv data/jev_verdict.json reports/jev_replay.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "bot: self-research and Jev replay validation"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
