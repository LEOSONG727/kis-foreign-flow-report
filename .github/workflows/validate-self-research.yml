name: Validate self-research and Jev replay

# PR 브랜치에서 저장소 Secret으로 검증한다. 결과 파일만 이 브랜치에 커밋한다.
# 현재 단계: DART 공시 제목 기반 Jev 판단을 과거 신호일로 재생해 키워드 규칙과 비교.
on:
  push:
    branches:
      - claude/funny-archimedes-rb1yay
    paths:
      - ".github/workflows/validate-self-research.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foreign-flow-data-write
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Report which secrets are present (values are never printed)
        run: |
          for name in TYPESAFE_API_KEY DART_API_KEY; do
            if [[ -n "${!name}" ]]; then echo "$name: set"; else echo "$name: MISSING"; fi
          done
      - name: Full research (DART financials, Jev replays, portfolio backtest) (validation run 3)
        run: python -m kis_flow_bot research --max-calls 2500
      - name: Persist validation results to this branch
        run: |
          git config user.name "foreign-flow-bot"
          git config user.email "foreign-flow-bot@users.noreply.github.com"
          for f in data/dart_corp_codes.csv data/dart_filings.csv data/dart_coverage.json data/dart_financials.csv \
            data/jev_event_answers.csv data/jev_event_verdict.json reports/jev_events.md \
            data/learned_ranker.json data/model_registry.json \
            reports/research_latest.md reports/research_factors.csv reports/research_oos.csv \
            data/jev_replay.csv data/jev_verdict.json reports/jev_replay.md \
            reports/portfolio_backtest.md reports/portfolio_backtest.csv; do
            if [[ -e "$f" ]]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "bot: research, DART financials and portfolio backtest validation"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
