name: Recalculate action report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.toml"
      - ".github/workflows/recalculate-report.yml"

permissions:
  contents: write

concurrency:
  group: foreign-flow-data-write
  cancel-in-progress: false

jobs:
  rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,ml]"
      - run: pytest
      - name: Recalculate from stored full-market data
        run: python -m kis_flow_bot rerank --no-notify
      - name: Upload recalculated report
        uses: actions/upload-artifact@v4
        with:
          name: recalculated-action-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
      - name: Persist report and decision state
        shell: bash
        run: |
          git config user.name "foreign-flow-bot"
          git config user.email "foreign-flow-bot@users.noreply.github.com"
          git add data/state.json reports
          if git diff --cached --quiet; then
            echo "변경된 재계산 결과가 없습니다."
            exit 0
          fi
          git commit -m "bot: recalculate action-ranked report"
          # This push-triggered job can wait behind the backtest because both
          # workflows serialize repository writes. During that wait the
          # backtest may advance main with calibration results, so rebase the
          # generated report commit onto the latest main before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
