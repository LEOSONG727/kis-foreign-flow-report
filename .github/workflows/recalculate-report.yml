name: Recalculate action report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.toml"
      - ".github/workflows/recalculate-report.yml"

permissions:
  contents: write

# Serialize all result writers; queue multiple pending runs without replacing them.
concurrency:
  group: foreign-flow-data-write
  queue: max
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,ml]"
      - run: pytest
      - name: Recalculate from stored full-market data
        run: python -m kis_flow_bot rerank --no-notify
      - name: Persist results
        shell: bash
        run: |
          bash .github/scripts/persist-results.sh "bot: recalculate action-ranked report" \
            data/state.json data/horizon_core.json data/ml_shadow_snapshots.csv \
            reports

      - name: Upload recalculated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recalculated-action-report-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
