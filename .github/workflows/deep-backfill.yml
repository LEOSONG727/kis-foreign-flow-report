name: Deep history backfill

# 자가검증은 표본 기간이 길어야 의미가 있다. 저장 이력을 과거로 확장한다.
# 시간 예산을 넘으면 진행분을 저장하고 끝나며, 다시 실행하면 이어서 채운다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "목표 기간(달력일, history_retention_days 이하)"
        required: false
        default: "540"
        type: string
      max_minutes:
        description: "이번 실행 시간 예산(분)"
        required: false
        default: "150"
        type: string

permissions:
  contents: write

# Serialize all result writers; queue multiple pending runs without replacing them.
concurrency:
  group: foreign-flow-data-write
  queue: max
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KIS_TOKEN_CACHE_DIR: ${{ runner.temp }}/kis-token-cache
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_CALLS_PER_SECOND: ${{ vars.KIS_CALLS_PER_SECOND || '5' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Extend stored history backwards
        shell: bash
        env:
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_MAX_MINUTES: ${{ inputs.max_minutes }}
        run: |
          # Reserve time for tests, checkout, commit and artifacts before the 180m job limit.
          python - <<'PY'
          import os
          budget = float(os.environ.get("INPUT_MAX_MINUTES") or "150")
          if not 0 < budget <= 150:
              raise SystemExit("max_minutes must be in (0, 150] to preserve the checkpoint before timeout")
          PY
          args=(deep-backfill)
          if [[ "$INPUT_DAYS" =~ ^[0-9]+$ ]]; then
            args+=(--days "$INPUT_DAYS")
          fi
          if [[ "$INPUT_MAX_MINUTES" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            args+=(--max-minutes "$INPUT_MAX_MINUTES")
          fi
          python -m kis_flow_bot "${args[@]}"
      - name: Persist results
        shell: bash
        run: |
          bash .github/scripts/persist-results.sh "bot: extend stored history backwards" \
            data/history.csv

      - name: Upload results and recovery files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-backfill-${{ github.run_number }}
          path: |
            reports/
            logs/
            data/history.csv
          if-no-files-found: warn
          retention-days: 30
