name: Deep history backfill

# 자가검증은 표본 기간이 길어야 의미가 있다. 저장 이력을 과거로 확장한다.
# 시간 예산을 넘으면 진행분을 저장하고 끝나며, 다시 실행하면 이어서 채운다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "목표 기간(달력일, history_retention_days 이하)"
        required: false
        default: "540"
        type: string
      max_minutes:
        description: "이번 실행 시간 예산(분)"
        required: false
        default: "150"
        type: string

permissions:
  contents: write

concurrency:
  group: foreign-flow-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_CALLS_PER_SECOND: ${{ vars.KIS_CALLS_PER_SECOND || '5' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Extend stored history backwards
        shell: bash
        env:
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_MAX_MINUTES: ${{ inputs.max_minutes }}
        run: |
          args=(deep-backfill)
          if [[ "$INPUT_DAYS" =~ ^[0-9]+$ ]]; then
            args+=(--days "$INPUT_DAYS")
          fi
          if [[ "$INPUT_MAX_MINUTES" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            args+=(--max-minutes "$INPUT_MAX_MINUTES")
          fi
          python -m kis_flow_bot "${args[@]}"
      - name: Persist history
        shell: bash
        run: |
          git config user.name "foreign-flow-bot"
          git config user.email "foreign-flow-bot@users.noreply.github.com"
          git add data/history.csv
          if git diff --cached --quiet; then
            echo "추가된 과거 이력이 없습니다."
            exit 0
          fi
          git commit -m "bot: extend stored history backwards"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
