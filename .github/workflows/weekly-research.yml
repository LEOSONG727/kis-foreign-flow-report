name: Weekly self-validation research

# 전종목 예측력(IC), 학습 도전자, 사전등록 가설, DART 재무, Jev 재생 검증, 포트폴리오 백테스트.
# 이력이 길어지면 오래 걸리므로 백테스트와 분리한다.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 0"

permissions:
  contents: write

concurrency:
  group: foreign-flow-data-write
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      DART_API_KEY: ${{ secrets.OpenDARTAPI }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Self-validation research
        run: python -m kis_flow_bot research --max-calls 3000
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist research results
        shell: bash
        run: |
          git config user.name "foreign-flow-bot"
          git config user.email "foreign-flow-bot@users.noreply.github.com"
          for f in data/learned_ranker.json data/model_registry.json \
            reports/research_latest.md reports/research_factors.csv reports/research_oos.csv \
            data/jev_replay.csv data/jev_verdict.json reports/jev_replay.md \
            data/dart_corp_codes.csv data/dart_filings.csv data/dart_coverage.json data/dart_financials.csv \
            data/jev_event_answers.csv data/jev_event_verdict.json reports/jev_events.md \
            reports/portfolio_backtest.md reports/portfolio_backtest.csv \
            data/dart_documents.csv data/earnings_quality_answers.csv data/earnings_quality_verdict.json \
            reports/earnings_quality.md; do
            if [[ -e "$f" ]]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "변경된 연구 결과가 없습니다."
            exit 0
          fi
          git commit -m "bot: weekly self-validation research"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
