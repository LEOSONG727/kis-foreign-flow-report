name: Weekly self-validation research

# 전종목 예측력(IC), 학습 도전자, 사전등록 가설, DART 재무, Jev 재생 검증, 포트폴리오 백테스트.
# 이력이 길어지면 오래 걸리므로 백테스트와 분리한다.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 0"

permissions:
  contents: write

# Serialize all result writers; queue multiple pending runs without replacing them.
concurrency:
  group: foreign-flow-data-write
  queue: max
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      DART_API_KEY: ${{ secrets.OpenDARTAPI }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Self-validation research
        run: python -m kis_flow_bot research --max-calls 3000
      - name: Persist results
        shell: bash
        run: |
          bash .github/scripts/persist-results.sh "bot: weekly self-validation research" \
            data/learned_ranker.json data/model_registry.json reports/research_latest.md \
            reports/research_factors.csv reports/research_oos.csv data/jev_replay.csv \
            data/jev_verdict.json reports/jev_replay.md data/dart_corp_codes.csv \
            data/dart_filings.csv data/dart_coverage.json data/dart_financials.csv \
            data/jev_event_answers.csv data/jev_event_verdict.json reports/jev_events.md \
            reports/portfolio_backtest.md reports/portfolio_backtest.csv data/dart_documents.csv \
            data/earnings_quality_answers.csv data/earnings_quality_verdict.json reports/earnings_quality.md

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-${{ github.run_number }}
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 30
