name: Validate production ML shadow

on:
  push:
    branches:
      - main
      - feature/ml-shadow-production
    paths:
      - ".github/workflows/validate-ml-shadow.yml"
      - ".github/scripts/persist-results.sh"
      - "src/kis_flow_bot/ml_shadow.py"
      - "src/kis_flow_bot/shadow_validation.py"
      - "tests/test_ml_shadow.py"
      - "tests/test_shadow_validation.py"
  workflow_dispatch:

permissions:
  contents: write

# Serialize all result writers; queue multiple pending runs without replacing them.
concurrency:
  group: foreign-flow-data-write
  queue: max
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  validate-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,ml]"

      - name: Test
        run: pytest

      - name: Rebuild report with production shadow
        run: python -m kis_flow_bot rerank --no-notify

      - name: Verify the latest ML and baseline snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          from kis_flow_bot.storage import read_csv
          from kis_flow_bot.shadow_validation import validate_latest_shadow_snapshot

          current = validate_latest_shadow_snapshot(
              read_csv(Path("reports/latest.csv")),
              read_csv(Path("data/ml_shadow_snapshots.csv")),
          )
          print(current.head(5)[
              ["ml_shadow_rank", "name", "ml_shadow_score", "discovery_rank"]
          ].to_string(index=False))
          PY

      - name: Persist results
        shell: bash
        run: |
          bash .github/scripts/persist-results.sh "bot: validate production ML shadow assets" \
            reports data/ml_shadow_snapshots.csv data/state.json \
            data/horizon_core.json

      - name: Upload results and recovery files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-ml-shadow-${{ github.run_number }}
          path: |
            reports/
            logs/
            data/ml_shadow_snapshots.csv
          if-no-files-found: warn
          retention-days: 30
