[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kis-foreign-flow-report"
version = "0.1.0"
description = "Daily KRX foreign accumulation ranking report powered by KIS Open API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]
ml = ["scikit-learn>=1.5,<2"]

[project.scripts]
kis-flow = "kis_flow_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
